<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Shortener{% endblock %}</title>
        <link rel="stylesheet" href="/static/style.css" />
        <script src="/static/vendor/htmx.min.js"></script>
    </head>
    <body>
        <header>
            <a href="/">Shortener</a>
            <nav>
                <a href="/docs">API</a>
                {% if user %}
                <span class="user-email">{{ user.email }}</span>
                <form method="post" action="/logout" class="inline-form">
                    <button type="submit" class="link-button">Log out</button>
                </form>
                {% else %}
                <a href="/login">Log in</a>
                <a href="/signup">Sign up</a>
                {% endif %}
            </nav>
        </header>

        <main>{% block content %}{% endblock %}</main>

        <footer>
            <p>Built with FastAPI + HTMX</p>
        </footer>

        <script>
            document.body.addEventListener("htmx:afterSwap", (e) => {
                if (e.detail.target.id === "links-body") {
                    // First link added — reveal the table, hide the placeholder
                    const table = document.getElementById("links-table");
                    const empty = document.getElementById("links-empty");
                    if (table && empty && table.style.display === "none") {
                        table.style.display = "";
                        empty.style.display = "none";
                    }
                }
            });

            document.body.addEventListener("htmx:afterSwap", () => {
                const tbody = document.getElementById("links-body");
                const table = document.getElementById("links-table");
                const empty = document.getElementById("links-empty");
                if (!tbody || !table || !empty) return;

                const hasRows = tbody.children.length > 0;
                table.style.display = hasRows ? "" : "none";
                empty.style.display = hasRows ? "none" : "block";
            });

            document.addEventListener("DOMContentLoaded", () => {
                const tbody = document.getElementById("links-body");
                const table = document.getElementById("links-table");
                const empty = document.getElementById("links-empty");
                if (!tbody || !table || !empty) return;

                const update = () => {
                    const hasRows = tbody.children.length > 0;
                    table.style.display = hasRows ? "" : "none";
                    empty.style.display = hasRows ? "none" : "block";
                };

                update(); // run once on load

                new MutationObserver(update).observe(tbody, {
                    childList: true,
                });
            });

            document.addEventListener("click", async (e) => {
                const btn = e.target.closest(".copy-btn");
                if (!btn) return;
                e.preventDefault();

                const url = btn.dataset.url;
                try {
                    await navigator.clipboard.writeText(url);
                    const original = btn.textContent;
                    btn.textContent = "✓";
                    btn.classList.add("copied");
                    setTimeout(() => {
                        btn.textContent = original;
                        btn.classList.remove("copied");
                    }, 1200);
                } catch (err) {
                    alert("Copy failed: " + err.message);
                }
            });
        </script>
    </body>
</html>
