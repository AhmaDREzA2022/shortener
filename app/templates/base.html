<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Shortener{% endblock %}</title>
        <link rel="stylesheet" href="/static/style.css" />
        <script src="/static/vendor/htmx.min.js"></script>
    </head>
    <body>
        <header>
            <a href="/">Shortener</a>
            <nav>
                <a href="/docs">API</a>
                {% if user %}
                <span class="user-email">{{ user.email }}</span>
                <form method="post" action="/logout" class="inline-form">
                    <button type="submit" class="link-button">Log out</button>
                </form>
                {% else %}
                <a href="/login">Log in</a>
                <a href="/signup">Sign up</a>
                {% endif %}
            </nav>
        </header>

        <main>{% block content %}{% endblock %}</main>

        <footer>
            <p>Built with FastAPI + HTMX</p>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const tbody = document.getElementById("links-body");
                const table = document.getElementById("links-table");
                const empty = document.getElementById("links-empty");
                if (tbody && table && empty) {
                    const update = () => {
                        const hasRows = tbody.children.length > 0;
                        table.style.display = hasRows ? "" : "none";
                        empty.style.display = hasRows ? "none" : "block";
                    };
                    update();
                    new MutationObserver(update).observe(tbody, {
                        childList: true,
                    });
                }

                document.addEventListener("htmx:responseError", (e) => {
                    const xhr = e.detail.xhr;
                    let msg = `Request failed (${xhr.status})`;
                    try {
                        const body = JSON.parse(xhr.responseText);
                        const detail = body.detail;
                        if (typeof detail === "string") {
                            msg = detail;
                        } else if (Array.isArray(detail) && detail.length) {
                            msg = detail[0].msg || msg;
                        }
                    } catch {}
                    alert(msg);
                });

                document.addEventListener("htmx:sendError", (e) => {
                    alert("Network error: could not reach the server.");
                });

                document.addEventListener("click", async (evt) => {
                    const btn = evt.target.closest(".copy-btn");
                    if (!btn) return;
                    evt.preventDefault();
                    try {
                        await navigator.clipboard.writeText(btn.dataset.url);
                        const orig = btn.textContent;
                        btn.textContent = "✓";
                        btn.classList.add("copied");
                        setTimeout(() => {
                            btn.textContent = orig;
                            btn.classList.remove("copied");
                        }, 1200);
                    } catch (err) {
                        alert("Copy failed: " + err.message);
                    }
                });
            });
        </script>
    </body>
</html>
